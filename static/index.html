<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cotizaciones · Impulso Tech</title>
  <meta name="theme-color" content="#1F4155">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/static/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip" href="#view">Saltar al contenido</a>

  <main id="login" class="login" hidden>
    <section class="login-art">
      <img class="login-logo" src="/static/logo.png" alt="Impulso Tech" width="300" height="300">
      <svg class="trail" viewBox="0 0 640 360" preserveAspectRatio="xMinYMax meet" aria-hidden="true">
        <path class="trail-line" pathLength="1" d="M-20 350 L150 250 L215 288 L380 150 L445 188 L588 58"/>
        <polygon class="trail-head" points="626,26 604,72 576,43"/>
      </svg>
    </section>
    <section class="login-panel">
      <form id="login-form" class="login-form" novalidate>
        <h1>Ingresar</h1>
        <p class="lead">Panel privado de cotizaciones.</p>
        <label class="field">
          <span>Usuario</span>
          <input name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>
        <label class="field">
          <span>Contraseña</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="form-error" role="alert"></p>
        <button class="btn primary block" type="submit">Ingresar</button>
      </form>
    </section>
  </main>

  <div id="app" class="shell" hidden>
    <aside class="side">
      <a class="side-brand" href="#/cotizaciones" aria-label="Impulso Tech, inicio">
        <img src="/static/logo.png" alt="" width="120" height="120">
      </a>
      <nav class="nav" aria-label="Principal">
        <a href="#/cotizaciones" data-nav="cotizaciones">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></svg>
          <span>Cotizaciones</span>
        </a>
        <a href="#/nueva" data-nav="nueva">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
          <span>Nueva</span>
        </a>
        <a href="#/ajustes" data-nav="ajustes">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
          <span>Ajustes</span>
        </a>
        <button id="logout" type="button">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5"/><path d="M15 8l4 4-4 4M19 12H9"/></svg>
          <span>Salir</span>
        </button>
      </nav>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript>Esta aplicación necesita JavaScript.</noscript>
  <script src="/static/app.js" defer></script>
</body>
</html>
